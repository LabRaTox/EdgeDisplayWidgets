[package]
name = "edgedash"
version = "1.5.0"
description = "Settings window for the Edge Dashboard"
authors = ["Heiko Stuhrmann"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "edge_dashboard_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
