[package]
name = "edgedash"
version = "1.7.4"
description = "Settings window for the Edge Dashboard"
authors = ["LabRaTox"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "edge_dashboard_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2.12 or newer: older versions pull in tao 0.35, which draws its own tall GTK
# header bar on Wayland instead of leaving the frame to the compositor.
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
